[project]
name = "env-dr3d"
version = "0.1.0"
description = "General-purpose physical simulation environment (Gazebo Sim) with a browser UI and an external-agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=12",
  "numpy>=1.26",
  "protobuf>=7.36.1,<8",  # must be >= protoc used by Homebrew gz-msgs12
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["api", "client"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
