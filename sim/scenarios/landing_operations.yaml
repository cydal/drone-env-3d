name: landing_operations
description: Designated landing/takeoff areas - three pads, a rooftop helipad and a moving platform in the open field.
world:
  name: autonomous_city
  file: autonomous_city.sdf
  bounds: {x: [-160, 160], y: [-140, 170], z: [-1, 90]}
  areas:
    - {name: operations, x: [-50, 50], y: [-100, -30]}
    - {name: urban, x: [20, 90], y: [0, 70]}
    - {name: industrial, x: [-125, -10], y: [-10, 100]}
    - {name: open_field, x: [35, 145], y: [-130, -45]}
    - {name: hill, x: [-95, -25], y: [85, 155]}
agents:
  - {id: drone_01, template: quadcopter, drone_type: standard, spawn: {position: {x: -25.0, y: -55.0, z: 0.25}}, observation: state, control: waypoint}
  - {id: drone_02, template: quadcopter, drone_type: heavy, spawn: {position: {x: 25.0, y: -55.0, z: 0.25}}, observation: state, control: waypoint}
entities:
  - id: platform_01
    template: platform
    type: dynamic
    spawn: {position: {x: 90.0, y: -70.0, z: 1.0}}
    trajectory: {type: line, start: {x: 60, y: -70, z: 1.0}, end: {x: 120, y: -70, z: 1.0}, speed: 1.5, loop: true}
    params: {length: 6, width: 6, height: 0.3}
environment: {time_of_day: morning}
simulation: {step_size: 0.004, real_time_factor: 1.0, seed: 51, start_paused: false, mode: realtime}
