name: moving_traffic
description: Ground vehicles on the main road, the industrial road and the test track; one drone observing from pad alpha.
world:
  name: autonomous_city
  file: autonomous_city.sdf
  bounds: {x: [-160, 160], y: [-140, 170], z: [-1, 90]}
  areas:
    - {name: operations, x: [-50, 50], y: [-100, -30]}
    - {name: urban, x: [20, 90], y: [0, 70]}
    - {name: industrial, x: [-125, -10], y: [-10, 100]}
    - {name: open_field, x: [35, 145], y: [-130, -45]}
    - {name: hill, x: [-95, -25], y: [85, 155]}
agents:
  - id: drone_01
    template: quadcopter
    drone_type: standard
    spawn: {position: {x: -25.0, y: -55.0, z: 0.25}}
    observation: full
    control: waypoint
    sensors:
      - {name: front_cam, type: camera, pose: [0.12, 0, -0.02, 0, 0.35, 0], params: {width: 320, height: 240, hfov: 1.4, update_rate: 10}}
      - {name: down_cam, type: camera, pose: [0, 0, -0.05, 0, 1.5708, 0], params: {width: 240, height: 240, hfov: 1.6, update_rate: 10}}
entities:
  - id: vehicle_01
    template: vehicle
    type: vehicle
    spawn: {position: {x: -150.0, y: -20.0, z: 0.75}}
    trajectory: {type: line, start: {x: -150, y: -20, z: 0.75}, end: {x: 150, y: -20, z: 0.75}, speed: 9.0, loop: true}
  - id: vehicle_02
    template: vehicle
    type: vehicle
    spawn: {position: {x: -110.0, y: -5.0, z: 0.75}}
    trajectory: {type: line, start: {x: -110, y: -5, z: 0.75}, end: {x: -10, y: -5, z: 0.75}, speed: 5.0, loop: true}
    params: {color: "0.85 0.75 0.15 1"}
  - id: vehicle_03
    template: vehicle
    type: vehicle
    spawn: {position: {x: 40.0, y: -90.0, z: 0.75}}
    trajectory: {type: waypoints, speed: 7.0, loop: true, waypoints: [{x: 40, y: -90, z: 0.75}, {x: 140, y: -90, z: 0.75}, {x: 140, y: -50, z: 0.75}, {x: 40, y: -50, z: 0.75}]}
    params: {color: "0.85 0.25 0.20 1"}
randomize:
  entities:
    vehicle_03:
      routes:
        - {type: waypoints, speed: 7.0, loop: true, waypoints: [{x: 40, y: -90, z: 0.75}, {x: 140, y: -90, z: 0.75}, {x: 140, y: -50, z: 0.75}, {x: 40, y: -50, z: 0.75}]}
        - {type: waypoints, speed: 5.0, loop: true, waypoints: [{x: 40, y: -50, z: 0.75}, {x: 140, y: -50, z: 0.75}, {x: 140, y: -90, z: 0.75}, {x: 40, y: -90, z: 0.75}]}
environment: {time_of_day: day}
simulation: {step_size: 0.004, real_time_factor: 1.0, seed: 31, start_paused: false, mode: realtime}
