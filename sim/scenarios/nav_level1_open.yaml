name: nav_level1_open
description: Level 1 navigation. Open field, one drone, a collision-free target marker. Start/target randomised by the task wrapper.
world:
  name: open_field
  file: open_field.sdf
  bounds: {x: [-60, 60], y: [-60, 60], z: [-1, 40]}
agents:
  - id: drone_01
    type: drone
    template: quadcopter
    spawn: {position: {x: 0.0, y: 0.0, z: 0.2}}
    observation: state
    control: velocity
    limits: {max_speed_xy: 4.0, max_speed_z: 2.0, max_yaw_rate: 1.5}
    params: {color: "0.95 0.45 0.10 1"}
entities:
  - id: target
    type: target
    template: target
    spawn: {position: {x: 15.0, y: 0.0, z: 5.0}}
    trajectory: {type: static}
    params: {radius: 0.6, color: "0.2 0.9 0.4 1", collide: false}
simulation:
  step_size: 0.004
  real_time_factor: 0.0
  seed: 1
  start_paused: true
  mode: stepped
episode:
  terminate_on: []
logging:
  enabled: false
