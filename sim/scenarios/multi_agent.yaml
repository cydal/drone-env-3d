name: multi_agent
description: Five drones of three types sharing the operations area; shared observations (own state + nearby agents).
world:
  name: autonomous_city
  file: autonomous_city.sdf
  bounds: {x: [-160, 160], y: [-140, 170], z: [-1, 90]}
  areas:
    - {name: operations, x: [-50, 50], y: [-100, -30]}
    - {name: urban, x: [20, 90], y: [0, 70]}
    - {name: industrial, x: [-125, -10], y: [-10, 100]}
    - {name: open_field, x: [35, 145], y: [-130, -45]}
    - {name: hill, x: [-95, -25], y: [85, 155]}
agents:
  - {id: drone_01, template: quadcopter, drone_type: standard, spawn: {position: {x: -25.0, y: -55.0, z: 0.25}}, observation: shared, control: waypoint}
  - {id: drone_02, template: quadcopter, drone_type: standard, spawn: {position: {x: 0.0, y: -55.0, z: 0.25}}, observation: shared, control: waypoint}
  - {id: drone_03, template: quadcopter, drone_type: light, spawn: {position: {x: 25.0, y: -55.0, z: 0.25}}, observation: shared, control: waypoint}
  - {id: drone_04, template: quadcopter, drone_type: light, spawn: {position: {x: -12.0, y: -35.0, z: 0.25}}, observation: shared, control: waypoint}
  - {id: drone_05, template: quadcopter, drone_type: heavy, spawn: {position: {x: 12.0, y: -35.0, z: 0.25}}, observation: central, control: waypoint}
environment: {time_of_day: day}
simulation: {step_size: 0.004, real_time_factor: 0.0, seed: 41, start_paused: true, mode: stepped}
