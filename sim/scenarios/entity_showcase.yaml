name: entity_showcase
description: >
  Three drone types with different sensor mounts, a moving platform, a rotating beacon,
  a patrolling vehicle and a circling target. Used to exercise the generic entity system.
world:
  name: test_city
  file: test_city.sdf
  bounds: {x: [-150, 150], y: [-150, 150], z: [-1, 80]}
agents:
  - id: drone_std
    template: quadcopter
    drone_type: standard
    spawn: {position: {x: 0.0, y: 1.5, z: 0.2}}
    observation: full
    control: waypoint
    sensors:
      - {name: front_cam, type: camera, pose: [0.12, 0, -0.02, 0, 0.35, 0], params: {width: 160, height: 120, hfov: 1.4, update_rate: 10}}
      - {name: down_cam,  type: camera, pose: [0.0, 0, -0.05, 0, 1.5708, 0], params: {width: 160, height: 120, hfov: 1.6, update_rate: 10}}
      - {name: front_depth, type: depth, pose: [0.12, 0, -0.02, 0, 0.35, 0], params: {width: 160, height: 120, hfov: 1.4, update_rate: 10}}
  - id: drone_light
    template: quadcopter
    drone_type: light
    spawn: {position: {x: 0.0, y: -1.5, z: 0.2}}
    observation: navigation
    control: waypoint
  - id: drone_heavy
    template: quadcopter
    drone_type: heavy
    spawn: {position: {x: -2.0, y: 0.0, z: 0.2}}
    observation: state
    control: waypoint
entities:
  - id: target_01
    template: target
    spawn: {position: {x: 20.0, y: -10.0, z: 8.0}}
    trajectory: {type: circle, center: {x: 20.0, y: -10.0, z: 8.0}, radius: 8.0, speed: 2.0}
    params: {radius: 0.5, color: "1.0 0.2 0.2 1"}
  - id: vehicle_01
    template: vehicle
    type: vehicle
    spawn: {position: {x: -30.0, y: -8.0, z: 0.75}}
    trajectory: {type: waypoints, speed: 4.0, loop: true, waypoints: [{x: -30, y: -8, z: 0.75}, {x: 30, y: -8, z: 0.75}, {x: 30, y: 30, z: 0.75}, {x: -30, y: 30, z: 0.75}]}
  - id: platform_01
    template: platform
    type: dynamic
    spawn: {position: {x: 40.0, y: 25.0, z: 2.0}}
    trajectory: {type: line, start: {x: 40, y: 25, z: 2.0}, end: {x: 40, y: 45, z: 6.0}, speed: 1.0, loop: true}
    params: {length: 5, width: 5, height: 0.3}
  - id: beacon_01
    template: beacon
    type: dynamic
    spawn: {position: {x: 20.0, y: 10.0, z: 25.0}}
    trajectory: {type: rotate, yaw_rate: 0.8}
simulation: {step_size: 0.004, real_time_factor: 1.0, seed: 3, start_paused: false, mode: realtime}
logging: {enabled: false}
